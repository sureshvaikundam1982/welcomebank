name: Spring Boot CI Pipeline

on:
push:
branches:
- main
workflow_dispatch:

jobs:
build-backend:
runs-on: ubuntu-latest


strategy:
  matrix:
    service:
      - eureka-server
      - config-server
      - api-gateway
      - auth-service
      - account-service
      - login-service
      - registration-service
      - transaction-service

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: 'temurin'

  - name: Build microservice
    working-directory: ${{ matrix.service }}
    run: mvn clean package


build-frontend:
runs-on: ubuntu-latest


steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '18'

  - name: Build React app
    working-directory: banking-frontend
    run: |
      npm install
      npm run build
```
